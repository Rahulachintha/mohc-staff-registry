<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ministry Staff Information Management System (SIMS) | Sri Lanka</title>

  <!-- Favicon / Official Ministry Crest -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/ministry-logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gov: {
              primary: '#0f2942',
              light: '#1e3a5f',
              dark: '#081624',
              accent: '#d97706',
              border: '#e2e8f0',
              bg: '#f8fafc',
              maroon: '#8d153a',
              orange: '#eb7a23',
              green: '#00534e',
              gold: '#fbb03b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            sinhala: ['Noto Sans Sinhala', 'sans-serif'],
            tamil: ['Noto Sans Tamil', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Application CSS -->
  <link rel="stylesheet" href="/styles.css?v=2.2">
</head>

<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

  <!-- Root mount point for React Application -->
  <div id="root">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <img src="/ministry-logo.png" alt="Ministry Emblem" class="w-20 h-auto rounded-lg shadow-md mb-4 object-contain">
      <div class="w-12 h-12 border-4 border-slate-300 border-t-blue-900 rounded-full animate-spin mb-4"></div>
      <h2 class="text-xl font-bold text-slate-800">Ministry Staff Information Management System</h2>
      <p class="text-sm text-slate-500 mt-1">Ministry of Housing, Construction and Water Supply, Sri Lanka</p>
      <p class="text-xs text-slate-400 mt-2">Loading application interface...</p>
    </div>
  </div>

  <!-- React Application Component Script with Cache Buster -->
  <script type="text/babel" src="/app.js?v=3.0"></script>
</body>

</html>
